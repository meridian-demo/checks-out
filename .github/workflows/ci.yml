name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: meridian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build ./... || true
      - run: go test ./... || true

      - name: Build cache service image
        run: |
          docker build \
            -f ./image-other/Dockerfile \
            -t cache-service:${{ github.sha }} \
            image-other
